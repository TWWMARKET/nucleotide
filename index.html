<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Docs</title>
  <link id="favicon" rel="icon" href="https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    #space-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      border-bottom: 1px solid #1e293b;
      background: rgba(11, 15, 25, 0.9);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #f8fafc;
    }

    .search-box input {
      padding: 8px 16px;
      width: 240px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: #64748b;
    }

    .panic-hint {
      font-size: 0.8rem;
      color: #64748b;
    }

    .panic-hint kbd {
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #334155;
      color: #ef4444;
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .game-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .game-card:hover {
      border-color: #475569;
    }

    .game-card h3 {
      font-size: 1.1rem;
      margin-top: 10px;
      color: #f8fafc;
    }

    .game-card p {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <canvas id="space-bg"></canvas>

  <header>
    <div class="logo">ATOM</div>
    <div class="search-box">
      <input type="text" id="searchInput" onkeyup="filterGames()" placeholder="Search...">
    </div>
    <div class="panic-hint">Press <kbd>Esc</kbd> to exit</div>
  </header>

  <main>
    <div class="game-grid" id="gameGrid">
      <div class="game-card" data-title="Eaglercraft" onclick="alert('Upload your Eaglercraft files to GitHub first!')">
        <div style="font-size: 2rem;">⛏️</div>
        <h3>Eaglercraft</h3>
        <p>Minecraft</p>
      </div>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('space-bg');
    const ctx = canvas.getContext('2d');

    let particles = [];
    const numParticles = 80;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.5 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.2;
        this.speedY = (Math.random() - 0.5) * 0.2;
        this.alpha = Math.random() * 0.5 + 0.1;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = 0;
        if (this.y < 0) this.y = canvas.height;
        if (this.y > canvas.height) this.y = 0;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < numParticles; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animate);
    }
    animate();

    function filterGames() {
      let input = document.getElementById('searchInput').value.toLowerCase();
      let cards = document.getElementsByClassName('game-card');

      for (let card of cards) {
        let title = card.getAttribute('data-title').toLowerCase();
        card.style.display = title.includes(input) ? 'block' : 'none';
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.location.href = 'https://classroom.google.com';
      }
    });
  </script>
</body>
</html>
