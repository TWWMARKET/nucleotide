<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Docs</title>
  <link id="favicon" rel="icon" href="https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #03050a;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    #space-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 35px;
      background: rgba(3, 5, 10, 0.85);
      border-bottom: 2px solid rgba(0, 229, 255, 0.3);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: #00ffff;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
      font-family: monospace;
    }

    /* Bold, styled search box */
    .search-box input {
      padding: 12px 20px;
      width: 280px;
      border-radius: 8px;
      border: 2px solid #00ffff;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      font-size: 1rem;
      font-weight: bold;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
    }

    .search-box input:focus {
      width: 330px;
      background: rgba(0, 20, 30, 0.8);
      box-shadow: 0 0 18px rgba(0, 255, 255, 0.5);
    }

    .panic-hint {
      font-size: 0.85rem;
      color: #a0aec0;
      font-weight: 600;
    }

    .panic-hint kbd {
      background: #1a202c;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #4a5568;
      color: #ff5555;
      font-weight: bold;
    }

    main {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .hero-title {
      text-align: center;
      margin-bottom: 40px;
    }

    .hero-title h2 {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      margin-bottom: 10px;
    }

    .hero-title p {
      color: #a0aec0;
      font-size: 1.1rem;
      font-weight: 500;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
    }

    .game-card {
      background: rgba(10, 15, 25, 0.8);
      border: 2px solid #1a365d;
      border-radius: 12px;
      padding: 25px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-5px);
      border-color: #00ffff;
      box-shadow: 0 5px 20px rgba(0, 255, 255, 0.3);
      background: rgba(15, 25, 45, 0.9);
    }

    .game-card h3 {
      font-size: 1.3rem;
      margin-top: 10px;
      color: #ffffff;
      font-weight: 800;
    }

    .game-card p {
      font-size: 0.9rem;
      color: #718096;
      margin-top: 5px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <canvas id="space-bg"></canvas>

  <header>
    <div class="logo">ATOM</div>
    <div class="search-box">
      <input type="text" id="searchInput" onkeyup="filterGames()" placeholder="SEARCH GAMES...">
    </div>
    <div class="panic-hint">Press <kbd>Esc</kbd> to Panic</div>
  </header>

  <main>
    <div class="hero-title">
      <h2>SYSTEM PORTAL</h2>
      <p>Select a node to launch</p>
    </div>

    <div class="game-grid" id="gameGrid">
      <div class="game-card" data-title="Eaglercraft" onclick="alert('Upload your Eaglercraft files to GitHub first!')">
        <div style="font-size: 2.5rem;">⛏️</div>
        <h3>Eaglercraft</h3>
        <p>Minecraft Web</p>
      </div>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('space-bg');
    const ctx = canvas.getContext('2d');

    let particles = [];
    const numParticles = 120;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.5 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.6;
        this.speedY = (Math.random() - 0.5) * 0.6;
        this.alpha = Math.random() * 0.8 + 0.2;
        this.glow = Math.random() > 0.8;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = 0;
        if (this.y < 0) this.y = canvas.height;
        if (this.y > canvas.height) this.y = 0;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = '#ffffff';

        if (this.glow) {
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#00ffff';
          ctx.fillStyle = '#80ffff';
        }

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < numParticles; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animate);
    }
    animate();

    function filterGames() {
      let input = document.getElementById('searchInput').value.toLowerCase();
      let cards = document.getElementsByClassName('game-card');

      for (let card of cards) {
        let title = card.getAttribute('data-title').toLowerCase();
        card.style.display = title.includes(input) ? 'block' : 'none';
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.location.href = 'https://classroom.google.com';
      }
    });
  </script>
</body>
</html>
